[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durgam"
version = "0.1.0"
description = "University ERP for SSSIHL — M0 Foundations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "docxtpl>=0.20.2",
    "fpdf2>=2.8.7",
    "minio>=7.2.20",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-docx>=1.2.0",
    "reflex==0.9.2",
    "sqlmodel>=0.0.38",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "faker>=24.0",
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.4",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded password false positives
    "S106",
    "S107",
    "N805",   # cls convention conflicts with SQLModel
    "N818",   # PermissionDenied follows Django/stdlib convention (no Error suffix)
    "B008",   # function call in default arg (common Reflex pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]
"scripts/*" = ["S", "ANN"]
"alembic/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=durgam --cov-report=term-missing"
filterwarnings = [
    "ignore:.*utcnow.*:DeprecationWarning:sqlmodel.*",
]
markers = [
    "e2e: end-to-end browser tests via Playwright",
]

[tool.coverage.run]
source = ["durgam"]
omit = [
    "durgam/durgam.py",          # app bootstrap — no unit-testable logic
    "*/migrations/*",
    # Pages and states are covered by E2E tests (DURGAM_E2E=1), not unit tests.
    # The 70% threshold applies only to layers that unit tests can reach:
    # services, repositories, models, auth, audit, nav.
    "durgam/pages/*",
    "durgam/states/*",
    "durgam/db.py",               # session factory, no business logic
    "durgam/storage/minio.py",    # external integration
    "durgam/notifications/admin_emails.py",  # template-only functions
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
