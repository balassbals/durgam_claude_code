services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: durgam
      POSTGRES_PASSWORD: durgam
      POSTGRES_DB: durgam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durgam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.24.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://durgam:durgam@db:5432/durgam
      DATABASE_URL_SYNC: postgresql+psycopg://durgam:durgam@db:5432/durgam
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: durgam
      MINIO_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@sssihl.edu.in
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
      ENVIRONMENT: development
    ports:
      - "3000:3000"
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: ["uv", "run", "reflex", "run"]

  celery_worker:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://durgam:durgam@db:5432/durgam
      DATABASE_URL_SYNC: postgresql+psycopg://durgam:durgam@db:5432/durgam
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@example.dev
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: ["uv", "run", "celery", "-A", "durgam.tasks.celery_app", "worker", "--loglevel=info"]
    profiles:
      - celery

  celery_beat:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://durgam:durgam@db:5432/durgam
      DATABASE_URL_SYNC: postgresql+psycopg://durgam:durgam@db:5432/durgam
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: ["uv", "run", "celery", "-A", "durgam.tasks.celery_app", "beat", "--loglevel=info"]
    profiles:
      - celery

volumes:
  pgdata:
  miniodata:
